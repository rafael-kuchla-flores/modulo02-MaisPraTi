<!doctype html>
<!--Informa ao navegador que este documento usa HTML5 -->
<html lang="pt-br">
  <!--Marca o inicio da pagina HTML. O atributo lang ='pt-br' vai indicar que o idioma principal é o portugues -->
  <head>
    <!--Cabeçalho da pagina. Aqui fica configurações e informações que não irão aparecer no corpo da página-->
    <meta charset="UTF-8" />
    <!--Define o padrão de caracteres. Permite acentos, Ç, emojis e caracteres especiais-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Faz a pagina se adaptar a celulares e computadores-->
    <title>Meu Primeiro site</title>
    <!-- Titulo da pagina, aparece na aba do navegador-->
  </head>
  <body>
    <!-- Corpo da pagina. Tudo o que aparace pro usuario fica aqui -->
    <h1>ola mundo</h1>
    <p>Esta é uma estrutura HTML basica</p>
    <ul>
      <li>HTML</li>
      <li>CSS</li>
      <li>JavaScript</li>
    </ul>
  </body>
</html>
